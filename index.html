<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFF8F0" />
    <link rel="icon" type="image/png" sizes="32x32" href="./brand/favicon-32.png?v=cream-1" />
    <link rel="apple-touch-icon" sizes="180x180" href="./brand/apple-touch-icon.png?v=cream-1" />
    <title>Janarty’s · What’s Out</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.squarespace-cdn.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; background: #fff8f0; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #fff8f0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 160ms ease-out;
      }
      #splash.leaving { opacity: 0; pointer-events: none; }
      .splash-bar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, #3b82f6, #a948a6 40%, #e83e8c 75%, #8b6bf0);
      }
      .splash-lockup {
        width: min(82vw, 340px);
        height: auto;
        display: block;
        opacity: 0;
        transform: scale(0.97);
        animation: splashLogo 300ms ease-out forwards;
      }
      @keyframes splashLogo {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-lockup {
          animation: none;
          opacity: 1;
          transform: none;
        }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-bar" aria-hidden="true"></div>
      <img
        class="splash-lockup"
        src="/src/assets/janartys-logo.png"
        fetchpriority="high"
        width="750"
        height="483"
        alt="Janarty’s Homemade Ice Cream"
      />
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var splash = document.getElementById("splash");
        if (!splash) return;
        var theme = document.querySelector('meta[name="theme-color"]');
        var app = document.getElementById("app");
        var logo = splash.querySelector("img");
        var minimumDisplayMs = 1000;
        var visibleAt = logo.complete ? performance.now() : null;
        var appReady = false;
        var scheduled = false;
        var done = false;
        app.inert = true;
        function finish() {
          if (done) return;
          done = true;
          splash.remove();
          app.inert = false;
          if (theme) theme.setAttribute("content", "#FFF8F0");
        }
        function reveal() {
          if (done) return;
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return finish();
          splash.classList.add("leaving");
          setTimeout(finish, 180);
        }
        function revealWhenReady() {
          if (done || scheduled || !appReady || visibleAt == null) return;
          scheduled = true;
          setTimeout(reveal, Math.max(0, minimumDisplayMs - (performance.now() - visibleAt)));
        }
        function logoReady() {
          if (visibleAt != null) return;
          visibleAt = performance.now();
          revealWhenReady();
        }
        logo.addEventListener("load", logoReady, { once: true });
        logo.addEventListener("error", logoReady, { once: true });
        window.addEventListener("janartys-ready", function () {
          appReady = true;
          revealWhenReady();
        }, { once: true });
        // Preserve the existing escape hatch if a script or network request fails.
        setTimeout(finish, 1800);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/native-chrome.js"></script>
  </body>
</html>

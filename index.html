<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>Janarty’s · What’s Out</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.squarespace-cdn.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=Montserrat:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; background: #000; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        background: #000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 160ms ease-out;
      }
      #splash.leaving { opacity: 0; pointer-events: none; }
      .splash-bar {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, #3b82f6, #a948a6 40%, #e83e8c 75%, #8b6bf0);
      }
      .splash-lockup {
        width: min(82vw, 340px);
        height: auto;
        display: block;
        opacity: 0;
        transform: scale(0.97);
        animation: splashLogo 300ms ease-out forwards;
      }
      @keyframes splashLogo {
        from { opacity: 0; transform: scale(0.97); }
        to { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-lockup {
          animation: none;
          opacity: 1;
          transform: none;
        }
        #splash { transition: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-bar" aria-hidden="true"></div>
      <img
        class="splash-lockup"
        src="https://images.squarespace-cdn.com/content/v1/6373c84849d6135c07860be8/f22d8770-c4f6-498a-a1a2-0d1646d06550/Janartys.png?format=750w"
        alt="Janarty’s Homemade Ice Cream"
      />
    </div>
    <div id="app"></div>
    <script>
      (function () {
        var splash = document.getElementById("splash");
        if (!splash) return;
        var theme = document.querySelector('meta[name="theme-color"]');
        var done = false;
        var returning = false;
        try { returning = sessionStorage.getItem("janartys-opened") === "yes"; } catch (_) {}
        function finish() {
          if (done) return;
          done = true;
          splash.remove();
          if (theme) theme.setAttribute("content", "#FFF8F0");
        }
        function ready() {
          try { sessionStorage.setItem("janartys-opened", "yes"); } catch (_) {}
          if (returning || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return finish();
          splash.classList.add("leaving");
          setTimeout(finish, 180);
        }
        window.addEventListener("janartys-ready", ready, { once: true });
        if (returning) finish();
        // Preserve the existing escape hatch if a script or network request fails.
        setTimeout(finish, 1800);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/native-chrome.js"></script>
  </body>
</html>

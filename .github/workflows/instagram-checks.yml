name: Instagram integration checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules
      - run: npm run build
      - run: npm ci --prefix push-relay
      - name: Bundle disabled Instagram Worker without deploying
        run: node push-relay/node_modules/wrangler/bin/wrangler.js deploy --config instagram-feed/wrangler.jsonc --dry-run --outdir instagram-feed/.wrangler/build

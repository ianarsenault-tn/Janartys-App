name: Instagram integration checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Prove the Worker works before root or push-relay/node_modules exists.
      - run: npm ci --prefix instagram-feed
      - run: npm test --prefix instagram-feed
      - run: npm run check --prefix instagram-feed
      - run: npm ci
      - run: npm ci --prefix push-relay
      - run: npm test
      - run: npm run check --prefix push-relay
      - run: npm run test:relay
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm run test:rules
      - run: npm run build
